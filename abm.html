<!DOCTYPE html>
<html>
<head>
<title>Book List</title>
<style>
body { font-family: sans-serif;
  background-color: pink;
}
ul { list-style-type: none; padding: 0; }
li { 
  display: flex; 
justify-content:space-between; 
align-item: center; margin-bottom: 5px; padding: 10px; border: 1px solid ; }
button { 
  padding: 5px 10px; background-color: red; color: lightblue; border: none; cursor: pointer; }
</style>
</head>
<body>

<h1>Book List</h1>

<input type="text" id="bookInput" placeholder="Enter book title">
<button onclick="addBook()">Add Book</button>

<ul id="bookList">
  <li>
    <span>The Lord of the Rings</span>
    <button onclick="deleteBook(0)">Delete</button> </li>
  <li>
    <span>Pride and Prejudice</span>
    <button onclick="deleteBook(1)">Delete</button> </li>
  <li>
    <span>1984</span>
    <button onclick="deleteBook(2)">Delete</button> </li>
</ul>
  
  <div class="nav-link">
    <a href="Admin.html">Back</a><br/>
  </div>

<script>
const bookListKey = 'bookList';

let bookList = JSON.parse(localStorage.getItem(bookListKey)) || [
  "The Lord of the Rings",
  "Pride and Prejudice",
  "1984"
];

function addBook() {
  const bookTitle = document.getElementById("bookInput").value;
  if (bookTitle.trim() !== "") {
    bookList.push(bookTitle);
    saveBookList();
    displayBookList();
    document.getElementById("bookInput").value = "";
  }
}

function deleteBook(index) {
  bookList.splice(index, 1);
  saveBookList();
  displayBookList();
}

function saveBookList() {
  localStorage.setItem(bookListKey, JSON.stringify(bookList));
}

function displayBookList() {
  const list = document.getElementById("bookList");
  list.innerHTML = "";

  bookList.forEach((book, index) => {
    const item = document.createElement("li");
    const titleSpan = document.createElement("span");
    titleSpan.textContent = book;
    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.onclick = () => deleteBook(index);
    item.appendChild(titleSpan);
    item.appendChild(deleteButton);
    list.appendChild(item);
  });
}

displayBookList();
</script>

</body>
</html>
